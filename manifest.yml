name: Glance
package: community.lazycat.app.glance
version: 0.8.4
min_os_version: 1.3.8
description: 一个将所有您的信息源集中在一个地方的本地托管仪表板
homepage: https://github.com/glanceapp/glance
author: glanceapp
application:
  subdomain: glance
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://glance:8080/

services:
  glance:
    container_name: glance
    #  glanceapp/glance
    image: docker.1ms.run/glanceapp/glance
    binds:
      - /lzcapp/var/data:/app/config
    setup_script: |
      if [ -f /app/config/glance.yml ]; then
        echo "Glance configuration file exists."
      else
        echo "Creating Glance configuration file..."
        cp -f /lzcapp/pkg/content/glance.yml /app/config/glance.yml
      fi

locales:
  zh:
    name: "Glance"
    description: "一个将所有您的信息源集中在一个地方的本地托管仪表板"
  zh_CN:
    name: "Glance"
    description: "一个将所有您的信息源集中在一个地方的本地托管仪表板"
  en:
    name: "Glance"
    description: "A self-hosted dashboard that puts all your feeds in one place"
